name: Deploy atlas demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check world and China atlas integrity
        run: |
          node --test tests/world.test.mjs
          node scripts/validate_atlas.js
      - uses: actions/configure-pages@v5
      - name: Export tracked static site files
        run: |
          mkdir _site
          git archive HEAD index.html manifest.webmanifest robots.txt sitemap.xml llms.txt LICENSE README.md README_ZH.md css js assets world topics geojson | tar -x -C _site
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
